<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pomodoro Timer</title>
  <link rel="stylesheet" href="../css/glassmorphism.css">
</head>
<body class="scene bg-ocean">

  <div class="blobs">
    <div class="blob blob-a"></div>
    <div class="blob blob-b"></div>
    <div class="blob blob-c"></div>
  </div>

  <div class="layer wrap" style="margin-top: 2rem;">

    <nav class="bar">
      <span class="title-s">Otium</span>
      <span class="fill"></span>
      <a class="bar-link" href="todo.html">To-do</a>
      <a class="bar-link on" href="pomodoro.html">Pomodoro</a>
    </nav>

    <div class="panel bold t-teal" style="margin-top: 2rem; text-align: center;">
      <p class="cap">Focus session</p>
      <div class="ring" style="width: 220px; height: 220px; margin: 1rem auto;">
        <span class="title title-l">25:00</span>
      </div>

      <div class="dots" style="margin-bottom: 1.5rem;">
        <span class="dot" id="dt1"></span>
        <span class="dot" id="dt2"></span>
        <span class="dot" id="dt3"></span>
        <span class="dot" id="dt4"></span>
      </div>

      <div class="row" style="justify-content: center;">
        <button class="btn btn-icon">⏸</button>
        <button class="btn btn-icon">⏭</button>
        <button class="btn btn-icon">☕</button>
      </div>

      <p class="muted" style="margin-top: 1.5rem;">Session 2 of 4 · next: short break</p>
    </div>

    <div class="grid" style="margin-top: 1rem;">
      <div class="card">
        <span class="cap">Session note</span>
        <input class="field" placeholder="What are you working on?">
      </div>
      <div class="card dim">
        <span class="cap">Today so far</span>
        <h3 class="title title-s">2h 10m focused</h3>
        <p class="muted">3 sessions completed</p>
      </div>
    </div>

  </div>

</body>
</html>
